<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>Offline - Kantor AI</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; background: #020617; color: #e2e8f0; font: 16px/1.6 system-ui, sans-serif; }
    main { max-width: 440px; border: 1px solid #334155; border-radius: 20px; background: #0f172a; padding: 28px; }
    h1 { font-size: 24px; color: #5eead4; }
    p { color: #cbd5e1; }
    button { border: 0; border-radius: 10px; padding: 12px 18px; background: #2dd4bf; color: #042f2e; font-weight: 700; font-size: 16px; }
  </style>
</head>
<body>
  <main>
    <h1>Koneksi terputus</h1>
    <p>Kantor AI memerlukan koneksi ke server untuk membuka laporan dan menyimpan pekerjaan. Data laporan tidak disimpan secara offline di perangkat ini.</p>
    <button onclick="location.reload()">Coba lagi</button>
  </main>
</body>
</html>
